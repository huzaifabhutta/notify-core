version: '3.8'

services:
  notify-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notify-core
    ports:
      - "8080:8080"
    environment:
      # Server
      - PORT=8080
      - ENV=production

      # Authentication - REQUIRED
      - API_KEYS=${API_KEYS:?API_KEYS environment variable must be set}

      # CORS Configuration
      - CORS_ORIGINS=${CORS_ORIGINS:-}

      # SMTP Configuration - REQUIRED
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?SMTP_USER must be set}
      - SMTP_PASS=${SMTP_PASS:?SMTP_PASS must be set}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}

      # WhatsApp Configuration (optional)
      - WA_TOKEN=${WA_TOKEN:-}
      - WA_PHONE_ID=${WA_PHONE_ID:-}

      # SMS Configuration (optional)
      - SMS_PROVIDER=${SMS_PROVIDER:-twilio}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_FROM=${SMS_FROM:-}

      # Database (optional for now)
      - DB_URL=postgres://${DB_USER:-notify}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-notify}?sslmode=disable

      # Templates
      - TEMPLATES_DIR=./templates
    volumes:
      - ./templates:/app/templates
    restart: unless-stopped
    networks:
      - notify-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: notify-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-notify}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=${DB_NAME:-notify}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-notify}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  notify-network:
    driver: bridge

volumes:
  postgres_data:
